name: docker

# Builds the image of the Dockerfile and runs the CI checks inside it; only
# when the environment definition changes (docs/REPRODUCIBILITY.md, section 9).
on:
  push:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements-lock.txt
      - experiments/cfd_smoke.py
      - .github/workflows/docker.yml
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t fyp-surrogate-gum .
      - name: Run the checks inside the image
        run: docker run --rm fyp-surrogate-gum
      - name: OpenFOAM inside the image reproduces a stored CFD run
        run: docker run --rm fyp-surrogate-gum python experiments/cfd_smoke.py
