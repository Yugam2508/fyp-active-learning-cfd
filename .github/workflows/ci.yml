name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies (CPU PyTorch)
        run: pip install -r requirements-lock.txt --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests
        run: python -m pytest -q
      - name: Benchmarks agree with UQTestFuns
        run: python experiments/check_benchmarks.py
      - name: Published records are reproduced (cross-machine tolerance)
        # Bitwise (rtol 1e-9) on the reference environment; other processors
        # change the last bits of BLAS/PyTorch results, which the
        # hyperparameter optimisation amplifies. See docs/REPRODUCIBILITY.md.
        run: python experiments/test_reproducibility.py --quick --rtol 1e-4
      - name: Numbers quoted in the papers are recomputed
        run: |
          python paper/imeko2027/check_numbers.py
          python experiments/analyse_journal.py --check
          python experiments/analyse_completion.py --check
          python paper/check_numbers_journal.py
